name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-lint-format-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Copy README for package metadata
        run: cp ../README.md .

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Security scan
        run: uv run bandit -r src/harnessbox/ -c pyproject.toml

      - name: Dependency audit
        run: uv run pip-audit

  sdk-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set Python version
        run: uv python install ${{ matrix.python-version }}

      - name: Copy README for package metadata
        run: cp ../README.md .

      - name: Install dependencies
        run: uv sync

      - name: Test with coverage
        run: uv run pytest tests/ -v --cov=harnessbox --cov-report=xml --cov-report=term-missing --cov-fail-under=64

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: sdk/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
