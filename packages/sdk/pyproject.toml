[project]
name = "harnessbox"
version = "0.3.0"
description = "Sandbox security, workspace, and harness primitives for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Nikhil Kadapala", email = "kadapalanikhil@gmail.com" },
]
dependencies = []
keywords = ["ai", "agents", "sandbox", "security", "claude-code", "e2b", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.scripts]
harnessbox = "harnessbox.cli:main"

[project.urls]
Homepage = "https://github.com/Nikhil-Kadapala/HarnessBox"
Repository = "https://github.com/Nikhil-Kadapala/HarnessBox"
Issues = "https://github.com/Nikhil-Kadapala/HarnessBox/issues"

[project.optional-dependencies]
e2b = ["e2b>=1.0.0"]
server = ["fastapi>=0.100.0", "sse-starlette>=1.0.0", "uvicorn>=0.20.0", "tenacity>=8.0.0"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "bandit",
    "pip-audit",
    "fastapi>=0.100.0",
    "sse-starlette>=1.0.0",
    "uvicorn>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessbox"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D101", "D102", "D103"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"examples/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
check_untyped_defs = false
disable_error_code = ["union-attr", "comparison-overlap", "attr-defined", "arg-type", "unused-ignore", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["e2b.*", "e2b_connect.*", "tenacity.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fastapi.*", "starlette.*", "sse_starlette.*", "uvicorn.*", "pydantic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "harnessbox.server",
    "harnessbox._server.routers.sessions",
    "harnessbox._server.routers._deps",
    "harnessbox.sandbox",
    "harnessbox._providers.e2b",
    "harnessbox._utils.timing",
]
warn_return_any = false
disable_error_code = ["union-attr", "attr-defined", "misc", "no-any-return", "untyped-decorator", "unused-ignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Single-module isolation tests (no cross-module coordination)",
    "integration: Multi-component coordination tests",
    "contract: Provider behavioral contract tests (parametrized mock/e2b)",
    "e2e: end-to-end tests requiring E2B_API_KEY (deselect with -m 'not e2e')",
]

[tool.coverage.run]
source = ["harnessbox"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 64
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "pass",
]

[tool.bandit]
exclude_dirs = ["tests", "src/harnessbox/security"]
skips = ["B101", "B110", "B311", "B404", "B603", "B607", "B608"]
