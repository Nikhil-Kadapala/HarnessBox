[project]
name = "harnessbox-api"
version = "0.1.0"
description = "HarnessBox Cloud API — shared routers with Supabase Auth + Stripe billing"
requires-python = ">=3.12"
dependencies = [
    "harnessbox[server]>=0.3.0",
    "supabase>=2.0.0",
    "stripe>=8.0.0",
    "pyjwt[crypto]>=2.8.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessbox_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["stripe.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
